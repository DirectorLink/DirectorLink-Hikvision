name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: pip install lupa
      - name: driver.xml checks
        run: cd tests && python test_xml.py
      - name: Hub tests
        run: cd tests && python test_hub.py
      - name: Camera tests
        run: cd tests && python test_camera.py
      - name: Build
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: DirectorLink-Hikvision
          path: |
            dist/*.c4z
            dist/SHA256SUMS.txt
